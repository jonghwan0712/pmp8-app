<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PMP 8판 크리티컬 패스</title>
<meta name="robots" content="noindex">
<meta name="description" content="PMP 8판 대비 시나리오 문제, 암기 카드, 계산 연습, 모의고사">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMP 8판">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBFDFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172324" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a project schedule. Domains are Gantt rows, the weakest one is marked critical, and the next question sits directly below. */
:root{
  --bg:#EEF3F1; --surface:#FBFDFC; --sunken:#E0E8E5; --line:#C4D1CC;
  --fg:#14292A; --muted:#536866; --accent:#0E5F5C; --accent-soft:#D3E7E3; --on-accent:#F4FBF9;
  --critical:#C93A2B; --critical-soft:#F8DFDA; --good:#23764A; --good-soft:#D8EEDF;
  --display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101A1B; --surface:#172324; --sunken:#0C1415; --line:#304140;
  --fg:#E5EFEC; --muted:#9BB0AC; --accent:#62C4B8; --accent-soft:#1D3B39; --on-accent:#08201E;
  --critical:#F27C6C; --critical-soft:#44211C; --good:#71CD97; --good-soft:#193725; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101A1B; --surface:#172324; --sunken:#0C1415; --line:#304140;
  --fg:#E5EFEC; --muted:#9BB0AC; --accent:#62C4B8; --accent-soft:#1D3B39; --on-accent:#08201E;
  --critical:#F27C6C; --critical-soft:#44211C; --good:#71CD97; --good-soft:#193725; color-scheme:dark}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.65 var(--body);word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand{font:400 21px/1.2 var(--display)}
.brand b{font-weight:400;color:var(--critical)}
.saved{font-size:12px;color:var(--muted);text-align:right}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:7px 11px 8px;color:var(--muted);font-weight:500;font-size:15px}
nav button[aria-current="page"]{color:var(--fg);border-color:var(--accent)}
main{padding-block:22px 40px;display:grid;gap:22px}
main>*{min-width:0}
h2{font:400 26px/1.25 var(--display);text-wrap:balance}
h3{font-size:16px;font-weight:700;line-height:1.4}
.lede{color:var(--muted);max-width:62ch}
.stack{display:grid;gap:12px}
.stack>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 14px;font-weight:500;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:13px}
.backup{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.filebtn{position:relative;overflow:hidden;display:inline-block;color:var(--muted);text-decoration:underline;font-size:13px}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:16px}
.chip{display:inline-block;padding:1px 8px;border-radius:3px;background:var(--sunken);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--critical-soft);color:var(--critical)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:5px 11px;font-size:14px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* schedule */
.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.status>div{background:var(--surface);padding:12px 14px;min-width:0}
.status .n{font:600 24px/1.2 var(--mono);display:block}
.status label,.status .k{font-size:12px;color:var(--muted);display:block}
.status input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:1px 0;font-size:16px;margin-top:2px;min-width:0}
.gantt{display:grid;gap:14px}
.grow{display:grid;grid-template-columns:150px minmax(0,1fr) 92px;gap:12px;align-items:center}
.grow .name{font-weight:700;font-size:15px;line-height:1.3}
.grow .name small{display:block;font:400 12px var(--mono);color:var(--muted)}
.track{position:relative;height:22px;background:var(--sunken);border-radius:2px}
.fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:2px}
.fill.crit{background:var(--critical)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.grow .v{text-align:right;font:600 14px var(--mono)}
.grow .v small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.mix{display:flex;height:30px;border-radius:2px;overflow:hidden;gap:2px;font:600 12px var(--mono)}
.mix span{display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);min-width:0;white-space:nowrap}

/* question */
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.qtext{font-size:17px;font-weight:500;line-height:1.7;max-width:68ch}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt .l{font:600 14px/1.65 var(--mono);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--critical);background:var(--critical-soft)}
.verdict{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:8px}
.verdict strong.y{color:var(--good)} .verdict strong.n{color:var(--critical)}
.ai-out{white-space:pre-wrap;background:var(--sunken);border-radius:4px;padding:12px;font-size:15px}

/* card */
.flash{width:100%;min-height:210px;display:grid;gap:12px;align-content:center;justify-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px 20px}
.flash .front{font:400 25px/1.35 var(--display);text-wrap:balance}
.flash .back{font-size:16px;white-space:pre-line;max-width:60ch}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* calc */
.given{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:12px}
.given div{background:var(--sunken);border-radius:4px;padding:8px 10px}
.given b{display:block;font:600 19px var(--mono)}
.given span{font-size:12px;color:var(--muted)}
.ans{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ans input{flex:1 1 150px;min-width:0;min-height:42px;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;font-family:var(--mono)}
.steps{font:400 14px/1.8 var(--mono);white-space:pre-wrap}
.diagram{overflow-x:auto;margin-top:12px}
.diagram svg{display:block;width:100%;max-width:560px;height:auto}
.formula{width:100%;border-collapse:collapse;font-size:14px}
.formula td,.formula th{padding:7px 10px 7px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.formula th{font-size:12px;color:var(--muted);font-weight:500}
.tablewrap{overflow-x:auto}

/* mock */
.timer{font:600 21px var(--mono)}
.timer.low{color:var(--critical)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dots button{width:34px;height:34px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font:400 13px var(--mono);padding:0}
.dots button.done{background:var(--accent-soft)}
.dots button.cur{border:2px solid var(--accent)}
.dots button.flag{border-color:var(--critical);color:var(--critical)}
.score{font:600 52px/1 var(--mono)}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field select,.field input,.ans input{font-size:16px}
.field select,.field input{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-height:42px;width:100%;color:var(--fg);font-size:15px;min-width:0}
.aigrid{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:10px;align-items:end}
footer{padding-block:0 32px;font-size:12px;color:var(--muted);line-height:1.7}
@media (max-width:640px){
  .status{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grow{grid-template-columns:minmax(0,1fr) 84px;gap:4px 10px}
  .grow .track{grid-column:1/-1;grid-row:2}
  .aigrid{grid-template-columns:minmax(0,1fr)}
  .grade .btn{padding-inline:6px}
}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s ease}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">PMP 8판 <b>크리티컬 패스</b></div>
      <div class="saved" id="saved" aria-live="polite">불러오는 중</div>
    </div>
    <nav id="nav" aria-label="학습 메뉴"></nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<footer class="wrap">
  학습 기록은 이 기기에만 저장됩니다. 앱을 지우기 전에 기록을 백업하세요. 문제와 카드는 이 앱을 위해 새로 쓴 연습용 자료이며 실제 시험 문제가 아닙니다. PMI와 관련이 없습니다. 8판 용어의 한글 표기는 임의 번역이라 공식 번역과 다를 수 있습니다. 시험 형식은 응시 전 PMI 공지와 2026 시험 내용 개요(ECO)로 확인하세요.
</footer>

<script>
/*DATA-START*/
const DOMAINS={people:{name:"사람",en:"People",w:33},process:{name:"프로세스",en:"Process",w:41},be:{name:"비즈니스 환경",en:"Business Environment",w:26}};
const BANK=[
{id:"p1",d:"people",pd:"자원",q:"두 시니어 개발자가 API 설계 방식을 두고 회의마다 충돌하고 있습니다. 최근에는 관련 작업까지 늦어지기 시작했습니다. 프로젝트 관리자가 먼저 해야 할 일은 무엇입니까?",o:["두 사람과 함께 쟁점을 확인하고 프로젝트 목표를 기준으로 합의안을 찾도록 돕는다","기능 관리자에게 알리고 한 명을 다른 업무로 재배치해 달라고 요청한다","스폰서에게 갈등을 보고하고 최종 결정을 요청한다","프로젝트 관리자가 더 나아 보이는 설계를 골라 팀에 지시한다"],a:0,x:"갈등이 업무에 영향을 주기 시작하면 당사자와 함께 직접 해결하는 협업 방식이 우선입니다. 재배치, 에스컬레이션, 일방적 지시는 근본 원인을 다루지 않습니다."},
{id:"p2",d:"people",pd:"이해관계자",q:"스프린트 진행 중 한 임원이 개발자에게 직접 찾아와 새 기능을 이번 주 안에 넣어 달라고 요청했습니다. 서번트 리더는 어떻게 대응해야 합니까?",o:["임원이 요청했으므로 개발자가 바로 작업하도록 일정을 비워 준다","요청을 거절하고 스프린트가 끝날 때까지 임원과 접촉하지 않도록 팀을 보호한다","임원과 제품 책임자를 연결해 요청의 가치를 평가하고 백로그에서 우선순위를 정하게 한다","요청을 변경 관리 위원회에 올리고 다음 분기까지 기다리게 한다"],a:2,x:"백로그 우선순위는 제품 책임자가 관리합니다. 서번트 리더는 팀의 집중을 지키면서 요청이 올바른 경로로 평가되도록 돕습니다. 요청 자체를 막는 것은 가치를 놓칠 수 있습니다."},
{id:"p3",d:"people",pd:"자원",q:"3개 시간대에 흩어진 신규 팀에서 응답 지연과 오해가 잦습니다. 팀 활동이 막 시작된 시점입니다. 가장 적절한 조치는 무엇입니까?",o:["모든 팀원이 같은 시간대 근무로 바꾸도록 요구한다","모든 의사소통을 프로젝트 관리자를 거치게 한다","문제를 일으키는 팀원을 찾아 성과 면담을 한다","팀이 함께 소통 시간, 응답 기대치, 도구를 정한 작업 합의서를 만든다"],a:3,x:"팀 헌장이나 작업 합의는 팀이 직접 만들 때 실천력이 높습니다. 초기 단계에서 기대치를 맞추는 것이 원격 팀의 오해를 줄이는 가장 직접적인 방법입니다."},
{id:"p4",d:"people",pd:"자원",q:"늘 성과가 좋던 팀원의 작업 품질이 지난 2주 동안 눈에 띄게 떨어졌습니다. 프로젝트 관리자가 가장 먼저 할 일은 무엇입니까?",o:["팀 회의에서 품질 기준을 다시 강조한다","해당 팀원과 비공개로 대화해 어떤 어려움이 있는지 듣는다","인사팀에 공식 경고 절차를 문의한다","해당 팀원의 작업을 다른 사람에게 넘긴다"],a:1,x:"원인을 알기 전에는 조치를 정할 수 없습니다. 민감할 수 있는 문제이므로 공개 지적이 아닌 1:1 대화로 시작합니다."},
{id:"p5",d:"people",pd:"자원",q:"숙련된 팀이 사소한 기술 결정까지 모두 프로젝트 관리자에게 승인받고 있어 작업이 자주 멈춥니다. 어떻게 해야 합니까?",o:["승인 회의를 하루 두 번으로 늘린다","프로젝트 관리자가 표준 결정 목록을 미리 만들어 배포한다","팀이 스스로 결정할 범위와 에스컬레이션 기준을 함께 정하고 권한을 위임한다","시니어 한 명을 승인권자로 지정한다"],a:2,x:"8판의 '권한 있는 문화 구축' 원칙과 맞습니다. 결정 경계를 분명히 하면 팀이 스스로 움직이고, 정말 필요한 사안만 위로 올라옵니다."},
{id:"p6",d:"people",pd:"이해관계자",q:"요구사항을 승인해야 하는 핵심 이해관계자가 회의에 계속 불참해 승인이 늦어지고 있습니다. 가장 먼저 할 일은 무엇입니까?",o:["스폰서에게 해당 이해관계자를 교체해 달라고 요청한다","이해관계자를 직접 만나 관심사와 선호하는 소통 방식을 파악하고 참여 방식을 조정한다","불참 시 묵시적 승인으로 간주한다고 통보한다","회의록을 보내고 답이 없으면 다음 단계로 진행한다"],a:1,x:"참여가 부족하면 원인을 파악해 참여 전략과 소통 방식을 조정합니다. 묵시적 승인이나 강행은 나중에 더 큰 재작업을 낳습니다."},
{id:"p7",d:"people",pd:"자원",q:"회고 때마다 같은 문제가 나오지만 달라지는 것이 없어 팀원들이 회고를 시간 낭비로 여기기 시작했습니다. 가장 효과적인 조치는 무엇입니까?",o:["회고 주기를 분기 1회로 줄인다","회고를 생략하고 그 시간을 개발에 쓴다","프로젝트 관리자가 개선안을 정해 팀에 공지한다","개선 항목을 한두 개로 좁혀 담당자를 정하고 다음 이터레이션 계획에 포함한다"],a:3,x:"개선이 실행되지 않는 것이 문제입니다. 항목 수를 줄이고 책임자와 실행 시점을 정해 눈에 보이는 작업으로 만듭니다."},
{id:"p8",d:"people",pd:"이해관계자",q:"해외 파트너사 담당자들이 회의 중에는 모두 동의하지만, 이후 합의 내용과 다르게 작업하는 일이 반복됩니다. 공개적인 반대를 꺼리는 문화로 보입니다. 어떻게 하는 것이 좋습니까?",o:["개별 대화나 서면 의견 수렴 등을 활용해 문화에 맞게 소통 방식을 조정한다","회의 중 각 담당자에게 공개적으로 반대 의견을 말하도록 요구한다","합의 위반 사례를 파트너사 경영진에게 공식 항의한다","계약을 재검토해 파트너사를 교체한다"],a:0,x:"문화적 차이를 인식하고 소통 방식을 맞추는 것이 먼저입니다. 공개 발언을 강요하면 같은 문제가 반복됩니다."},
{id:"p9",d:"people",pd:"거버넌스",q:"입찰 평가가 진행 중인데 한 공급업체가 평가 담당 팀원에게 고가의 선물을 보냈습니다. 팀원이 어떻게 해야 할지 묻습니다. 올바른 답은 무엇입니까?",o:["금액이 크지 않다면 받아도 되지만 평가에는 반영하지 말라고 한다","선물을 팀 전체가 나누게 한다","받지 않도록 하고 조직 정책에 따라 사실을 보고한다","평가가 끝난 뒤에 받도록 공급업체에 요청한다"],a:2,x:"이해 충돌은 책임과 정직의 문제입니다. 받지 않고, 조직의 윤리 및 조달 절차에 따라 투명하게 공개합니다."},
{id:"p10",d:"people",pd:"이해관계자",q:"스프린트 리뷰에서 이해관계자가 결과물이 기대와 다르다고 말했습니다. 팀은 합의된 인수 기준을 모두 충족했습니다. 가장 적절한 대응은 무엇입니까?",o:["인수 기준을 충족했으므로 피드백을 받지 않고 완료 처리한다","피드백을 수집해 제품 책임자와 백로그에 반영하고 다음 스토리에서 더 일찍 검증한다","다음 스프린트를 취소하고 해당 기능을 처음부터 다시 만든다","인수 기준을 작성한 제품 책임자의 책임을 이해관계자에게 설명한다"],a:1,x:"리뷰의 목적이 피드백입니다. 작업은 기준대로 완료되었더라도 새로 알게 된 내용은 백로그로 반영하고, 검증 시점을 앞당겨 격차를 줄입니다."},
{id:"p11",d:"people",pd:"자원",q:"합류한 지 얼마 안 된 팀원이 핵심 도구에 익숙하지 않아 작업 속도가 느립니다. 일정에는 약간의 여유가 있습니다. 어떻게 하는 것이 가장 좋습니까?",o:["숙련자와 짝 작업을 하게 하고 필요한 교육을 지원한다","숙련된 외주 인력으로 교체를 요청한다","해당 팀원에게 쉬운 작업만 계속 배정한다","혼자 학습해 따라오도록 초과 근무를 요청한다"],a:0,x:"역량 격차는 멘토링과 교육으로 메우는 것이 우선입니다. 일정 여유가 있어 팀 역량을 키우는 투자가 가능합니다."},
{id:"p12",d:"people",pd:"자원",multi:true,q:"팀의 번아웃 신호가 뚜렷합니다. 야근이 잦아지고 결함도 늘었습니다. 프로젝트 관리자가 할 일을 2개 고르세요.",o:["초과 근무 수당을 늘려 동기를 유지한다","팀원들과 대화해 업무 부담의 원인을 듣는다","작업량 자료를 바탕으로 우선순위와 범위 조정을 이해관계자와 논의한다","업무 집중을 위해 회고를 잠시 중단한다"],a:[1,2],x:"원인을 듣고, 지속 가능한 업무량이 되도록 범위와 우선순위를 조정합니다. 수당은 원인을 해결하지 못하고, 회고 중단은 문제를 숨깁니다."},

{id:"c1",d:"process",pd:"범위",q:"예측형 프로젝트에서 고객이 승인된 범위 기준선에 새 보고서를 추가해 달라고 요청했습니다. 프로젝트 관리자가 다음에 할 일은 무엇입니까?",o:["고객 요청이므로 팀에 즉시 작업을 지시한다","범위 밖이므로 요청을 거절한다","변경 요청을 기록하고 범위, 일정, 비용, 리스크 영향을 분석한다","스폰서에게 요청 승인을 바로 구한다"],a:2,x:"예측형 환경에서는 영향 분석 후 정해진 변경 통제 절차로 결정합니다. 분석 없이는 승인할 근거가 없습니다."},
{id:"c2",d:"process",pd:"리스크",q:"리스크 등록부에 있던 핵심 부품 공급 지연이 실제로 발생했습니다. 프로젝트 관리자가 먼저 해야 할 일은 무엇입니까?",o:["계획된 리스크 대응을 실행한다","변경 요청을 제출하고 승인을 기다린다","새로운 리스크 식별 워크숍을 연다","관리 예비비 사용을 스폰서에게 요청한다"],a:0,x:"이미 식별하고 대응을 계획한 리스크라면 그 계획을 실행합니다. 이후 결과를 이슈 로그와 리스크 등록부에 반영합니다."},
{id:"c3",d:"process",pd:"리스크",q:"아무도 예상하지 못한 시스템 장애로 시험 환경이 멈췄습니다. 등록부에는 관련 리스크가 없습니다. 가장 먼저 할 일은 무엇입니까?",o:["우발 사태 예비비를 즉시 집행한다","프로젝트를 중단하고 스폰서 지시를 기다린다","영향을 평가하고 임시 해결책을 마련해 이슈로 기록한다","리스크 관리 계획을 처음부터 다시 쓴다"],a:2,x:"식별되지 않은 리스크가 현실화되면 이슈로 다룹니다. 영향을 평가하고 임시 해결책을 적용한 뒤 재발 방지를 검토합니다."},
{id:"c4",d:"process",pd:"재무",q:"프로젝트의 CPI가 0.85, SPI가 1.10입니다. 현재 상황을 가장 잘 설명한 것은 무엇입니까?",o:["예산을 초과했고 일정도 지연되었다","예산을 초과했지만 일정은 앞서 있다","예산은 남았지만 일정이 지연되었다","예산도 남았고 일정도 앞서 있다"],a:1,x:"CPI가 1보다 작으면 비용 초과, SPI가 1보다 크면 일정 선행입니다. 일정을 앞당기느라 비용을 더 썼을 가능성을 살펴야 합니다."},
{id:"c5",d:"process",pd:"일정",q:"크리티컬 패스 작업이 지연되어 납기를 맞추려면 일정을 줄여야 합니다. 예산에는 여유가 있지만 작업 순서를 겹치면 재작업 위험이 큽니다. 가장 적절한 기법은 무엇입니까?",o:["패스트 트래킹","자원 평준화","범위 축소 후 통보","크래싱"],a:3,x:"크래싱은 비용을 더 들여 기간을 줄이며, 크리티컬 패스 작업에 적용해야 효과가 있습니다. 패스트 트래킹은 병행으로 재작업 위험을 높입니다. 자원 평준화는 오히려 기간을 늘릴 수 있습니다."},
{id:"c6",d:"process",pd:"거버넌스",q:"의료기기 소프트웨어 프로젝트입니다. 규제 문서와 검증 절차는 고정되어 있지만, 사용자 화면 요구사항은 사용자 반응에 따라 계속 바뀔 전망입니다. 어떤 방식이 가장 적합합니까?",o:["전 범위에 예측형 적용","전 범위에 스크럼만 적용","규제 산출물은 계획 중심으로, 화면은 반복 개발로 진행하는 하이브리드 적용","요구사항이 안정될 때까지 착수 연기"],a:2,x:"불확실성이 영역마다 다르면 테일러링한 하이브리드가 적합합니다. 규제 요구와 빠른 피드백을 함께 충족할 수 있습니다."},
{id:"c7",d:"process",pd:"범위",q:"팀마다 '완료'를 다르게 해석해 테스트를 빠뜨린 스토리가 리뷰에 올라옵니다. 무엇으로 해결해야 합니까?",o:["팀이 합의한 완료의 정의(DoD)를 명확히 하고 모든 스토리에 적용한다","프로젝트 관리자가 모든 스토리를 직접 검수한다","스토리 포인트 추정 값을 늘린다","완료 판단을 스프린트 리뷰 이후로 미룬다"],a:0,x:"DoD는 모든 작업 항목에 공통으로 적용되는 품질 기준입니다. 스토리별 조건인 인수 기준과 구분해 기억하세요."},
{id:"c8",d:"process",pd:"범위",q:"최종 결과물이 완성되었고 내부 검사도 통과했습니다. 그러나 고객의 공식 인수 서명은 받지 못했습니다. 프로젝트 관리자가 다음에 할 일은 무엇입니까?",o:["최종 보고서를 발행하고 프로젝트를 닫는다","팀원을 해산하고 교훈을 정리한다","고객과 인수 기준을 기준으로 결과물을 확인해 공식 인수를 받는다","운영팀에 결과물을 바로 이관한다"],a:2,x:"내부 품질 통제와 고객의 범위 검증은 다릅니다. 종료 활동은 공식 인수를 받은 뒤 진행합니다."},
{id:"c9",d:"process",pd:"범위",q:"한 공정에서 결함이 계속 발생합니다. 어떤 원인이 결함 대부분을 차지하는지 파악해 개선 순서를 정하려고 합니다. 가장 알맞은 도구는 무엇입니까?",o:["번다운 차트","파레토 차트","간트 차트","RACI 차트"],a:1,x:"파레토 차트는 빈도순으로 원인을 정렬해 영향이 큰 소수의 원인을 찾게 해 줍니다."},
{id:"c10",d:"process",pd:"일정",q:"번다운 차트가 사흘째 줄지 않고 있습니다. 팀은 바쁘다고 합니다. 스크럼 마스터 역할의 프로젝트 관리자가 먼저 무엇을 해야 합니까?",o:["스프린트 기간을 연장한다","남은 스토리를 다음 스프린트로 모두 옮긴다","팀원에게 시간별 업무 보고를 요구한다","팀과 함께 무엇이 작업 완료를 막는지 확인하고 장애물을 제거한다"],a:3,x:"차트는 신호일 뿐입니다. 팀과 원인을 찾아 장애물을 제거합니다. 기간 연장은 타임박스 원칙에 어긋납니다."},
{id:"c11",d:"process",pd:"범위",q:"한 개발자가 고객이 좋아할 것 같아 승인되지 않은 기능을 추가로 만들었다는 사실을 프로젝트 관리자가 발견했습니다. 어떻게 해야 합니까?",o:["고객에게 깜짝 선물로 제공한다","개발자와 대화하고 변경 통제 절차에 따라 기능의 영향을 평가해 유지 또는 제거를 결정한다","고객 몰래 조용히 코드를 삭제한다","범위 기준선을 직접 수정해 기능을 포함한다"],a:1,x:"요청 없는 추가 구현은 골드 플레이팅입니다. 새 리스크와 비용을 만들 수 있으므로 투명하게 평가합니다."},
{id:"c12",d:"process",pd:"재무",q:"새 기술을 탐색하는 외주 작업으로 범위를 미리 정의하기 어렵습니다. 빠르게 시작해야 합니다. 어떤 계약 유형이 가장 알맞습니까?",o:["시간 자재 계약(T&M)","확정 고정가 계약(FFP)","성과 보상 고정가 계약(FPIF)","경제적 가격 조정 고정가 계약(FP-EPA)"],a:0,x:"범위가 불명확하고 빠른 착수가 필요할 때 T&M이 적합합니다. 고정가 계약은 범위가 잘 정의되어야 합니다."},
{id:"c13",d:"process",pd:"자원",q:"공급업체가 계약된 납기를 3주 넘길 것 같다고 알려 왔습니다. 프로젝트 관리자가 먼저 할 일은 무엇입니까?",o:["즉시 계약 해지를 통보한다","대체 업체와 바로 계약한다","계약 조항과 일정 영향을 검토하고 공급업체와 회복 방안을 협의한다","소송 부서에 사건을 넘긴다"],a:2,x:"계약 조건과 영향을 먼저 파악하고 협의합니다. 해지나 분쟁은 그 결과에 따라 고려하는 후속 수단입니다."},
{id:"c14",d:"process",pd:"리스크",q:"리스크 40건이 식별되었는데 시간이 부족합니다. 어떤 리스크에 집중할지 빠르게 정하려면 무엇을 해야 합니까?",o:["모든 리스크에 대해 몬테카를로 분석을 수행한다","확률과 영향을 평가해 우선순위를 매긴다","등록 순서대로 대응 계획을 만든다","가장 비용이 큰 리스크 하나만 관리한다"],a:1,x:"정성적 분석은 확률과 영향으로 빠르게 우선순위를 정합니다. 정량 분석은 시간과 데이터가 더 필요합니다."},
{id:"c15",d:"process",pd:"범위",multi:true,q:"제품 백로그 정제에서 일반적으로 이루어지는 활동을 2개 고르세요.",o:["제품 책임자가 가치를 기준으로 항목 순서를 정리한다","팀이 큰 항목을 나누고 규모를 추정한다","프로젝트 관리자가 개인별 근무 시간을 배정한다","완료된 스프린트의 속도를 삭제한다"],a:[0,1],x:"정제는 곧 다룰 항목을 준비 상태로 만드는 활동입니다. 순서 정리, 분할, 추정, 인수 기준 명확화가 포함됩니다."},
{id:"c16",d:"process",pd:"이해관계자",q:"프로젝트 헌장이 막 승인되었습니다. 프로젝트 관리자가 초기에 해야 할 일로 가장 적절한 것은 무엇입니까?",o:["상세 WBS를 작성해 작업을 배정한다","이해관계자를 식별하고 관심사와 영향력을 분석한다","결과물 품질 감사를 수행한다","교훈 저장소를 닫는다"],a:1,x:"착수 단계의 핵심은 권한 확보와 이해관계자 식별입니다. 상세 계획은 이들의 요구를 파악한 뒤 진행합니다."},

{id:"b1",d:"be",pd:"거버넌스",q:"프로젝트 진행 중 새 데이터 보호 법규가 공포되었습니다. 시행 전 시스템 출시가 예정되어 있지만 운영 기간에는 적용을 받습니다. 어떻게 해야 합니까?",o:["출시가 먼저이므로 법규를 무시한다","컴플라이언스 담당자와 영향을 평가하고 필요한 변경을 제기한다","프로젝트를 즉시 취소한다","시행 이후 문제가 생기면 대응한다"],a:1,x:"외부 환경 변화는 영향을 먼저 평가합니다. 준수 요건은 선택 사항이 아니며 변경 절차를 통해 반영합니다."},
{id:"b2",d:"be",pd:"거버넌스",q:"경쟁사의 신제품 출시로 프로젝트의 예상 수익이 크게 줄어들 전망입니다. 계획 대비 진행은 순조롭습니다. 프로젝트 관리자는 무엇을 해야 합니까?",o:["일정대로 진행 중이므로 계속 수행한다","팀에 범위를 늘려 경쟁력을 높이라고 지시한다","독자적으로 프로젝트를 종료한다","비즈니스 케이스 영향을 분석해 스폰서와 거버넌스 기구에 지속 여부 검토를 요청한다"],a:3,x:"프로젝트의 정당성은 계속 확인해야 합니다. 가치 전제가 흔들리면 분석 자료를 들고 의사결정 권한이 있는 쪽에 올립니다."},
{id:"b3",d:"be",pd:"재무",q:"초기 비용이 비슷한 두 장비 공급업체를 비교합니다. A는 에너지 사용량이 훨씬 적지만 납기가 조금 더 깁니다. 지속가능성 원칙을 고려한 평가 방식은 무엇입니까?",o:["구매 가격만 비교한다","전 수명 주기의 비용과 환경 영향을 포함해 일정 영향과 함께 평가한다","납기가 짧은 B를 자동으로 선택한다","친환경이므로 다른 평가 없이 A를 선택한다"],a:1,x:"8판은 지속가능성 통합을 원칙으로 강조합니다. 초기 비용뿐 아니라 수명 주기 비용과 환경 및 사회적 영향을 다른 제약과 균형 있게 봅니다."},
{id:"b4",d:"be",pd:"거버넌스",q:"프로젝트는 곧 끝나지만 비용 절감 효과는 출시 1년 뒤에야 측정할 수 있습니다. 편익 실현을 보장하려면 무엇이 필요합니까?",o:["편익 측정을 포기하고 납품 완료를 성공으로 본다","프로젝트 팀을 1년간 유지한다","편익 지표, 측정 시점, 운영 조직의 책임자를 편익 관리 계획에 정해 이관한다","프로젝트 관리자가 개인적으로 1년 뒤 고객에게 연락한다"],a:2,x:"편익은 프로젝트 종료 뒤 실현되는 경우가 많습니다. 측정 지표와 책임자를 명확히 해 운영으로 인계합니다."},
{id:"b5",d:"be",pd:"재무",q:"두 프로젝트 중 하나만 선택해야 합니다. A는 NPV 120억 원에 회수 기간 3년, B는 NPV 150억 원에 회수 기간 4년입니다. 다른 조건이 같다면 재무적으로 어느 쪽을 선택해야 합니까?",o:["회수 기간이 짧은 A","NPV가 큰 B","둘 다 선택","회수 기간 평균이 같아질 때까지 보류"],a:1,x:"상호 배타적인 프로젝트는 일반적으로 NPV가 큰 쪽을 선택합니다. 현금 유동성 제약이 있다면 회수 기간도 함께 고려합니다."},
{id:"b6",d:"be",pd:"거버넌스",q:"프로젝트마다 보고 양식이 달라 경영진이 현황을 비교하기 어렵습니다. 프로젝트 관리자가 할 수 있는 가장 알맞은 조치는 무엇입니까?",o:["자기 프로젝트 양식을 다른 팀에 강제로 적용한다","경영진에게 보고 자료를 읽지 말라고 한다","PMO와 협력해 공통 지표와 테일러링 가능한 표준 양식을 정한다","보고 횟수를 줄인다"],a:2,x:"PMO는 표준화와 역량 지원을 맡을 수 있습니다. 공통 기준을 두되 프로젝트 특성에 맞게 조정할 여지를 남겨야 합니다."},
{id:"b7",d:"be",pd:"이해관계자",q:"새 ERP 도입이 다가오는데 현장 부서가 업무 방식이 바뀌는 데 강하게 반발합니다. 어떻게 하는 것이 가장 좋습니까?",o:["경영진 지시임을 알리고 일정대로 강행한다","현장 대표를 참여시켜 변화 이유를 공유하고 교육과 지원 계획을 함께 조정한다","현장 부서를 프로젝트 소통 대상에서 제외한다","시스템 도입을 무기한 연기한다"],a:1,x:"조직 변화 관리에서는 영향받는 사람의 참여, 변화 이유 공유, 역량 지원이 핵심입니다."},
{id:"b8",d:"be",pd:"거버넌스",q:"한 팀원이 고객 계약 데이터를 공개 AI 챗봇에 넣어 요약했다고 말했습니다. 조직 정책 확인은 하지 않았습니다. 가장 먼저 할 일은 무엇입니까?",o:["작업 시간이 줄었으므로 다른 팀원에게도 권장한다","요약 품질만 검토하고 넘어간다","해당 팀원의 AI 사용 권한을 영구 차단하고 공개한다","사용을 멈추게 하고 정책과 계약 조건을 확인한 뒤 담당 부서에 보고해 영향을 평가한다"],a:3,x:"생산성보다 데이터 보호와 준수가 우선입니다. 노출 가능성을 평가하고, 승인된 도구와 사람의 검증 기준을 마련해야 합니다."},
{id:"b9",d:"be",pd:"거버넌스",q:"포트폴리오 재조정으로 프로젝트 우선순위가 낮아졌고 핵심 인력 일부를 회수한다는 통보를 받았습니다. 프로젝트 관리자가 할 일은 무엇입니까?",o:["결정을 무시하고 인력을 내주지 않는다","납기와 범위를 변경하지 않고 남은 인력으로 진행한다","결정 범위를 확인하고 일정과 범위 영향을 분석해 이해관계자와 조정안을 합의한다","즉시 프로젝트를 취소한다"],a:2,x:"프로젝트는 조직 전략에 맞춰 움직입니다. 결정을 이해하고 영향을 투명하게 제시한 뒤 기준선을 조정합니다."},
{id:"b10",d:"be",pd:"거버넌스",q:"비용 변경안이 프로젝트 관리자의 승인 한도를 넘습니다. 변경이 시급하고 고객도 강하게 원합니다. 어떻게 처리해야 합니까?",o:["영향 분석과 함께 거버넌스에 정해진 상위 승인 경로로 올린다","고객이 원하므로 먼저 진행하고 사후 보고한다","비용을 여러 건으로 나눠 한도 내로 승인한다","팀이 투표로 결정한다"],a:0,x:"거버넌스는 누가 어떤 결정을 내리는지 정합니다. 시급해도 한도를 우회하면 안 되며, 필요한 경우 긴급 승인 경로를 활용합니다."},
{id:"b11",d:"be",pd:"재무",q:"신규 서비스에 대한 시장 수요가 불확실합니다. 많은 투자 전에 가치를 검증하려면 어떤 접근이 가장 좋습니까?",o:["모든 기능을 완성한 후 시장에 출시한다","시장 조사가 끝날 때까지 개발을 시작하지 않는다","핵심 가설을 시험할 최소 기능 제품(MVP)을 출시하고 결과로 다음 투자를 정한다","경쟁사 제품을 그대로 따른다"],a:2,x:"MVP는 적은 비용으로 학습하고 가치를 일찍 확인하게 합니다. '가치 중심' 원칙과 맞습니다."},
{id:"b12",d:"be",pd:"거버넌스",multi:true,q:"규제 감사에 대비하려는 프로젝트입니다. 프로젝트 관리자가 할 일을 2개 고르세요.",o:["요구사항에서 시험 결과까지 추적 가능한 증빙을 유지한다","컴플라이언스 담당자를 프로젝트 초기부터 참여시킨다","감사 직전에 문서를 한꺼번에 작성한다","감사인에게 불리한 기록을 삭제한다"],a:[0,1],x:"준수는 처음부터 프로세스에 포함해야 합니다. 품질을 프로세스에 내재화하는 원칙과 같은 맥락입니다."}
];

const Q_DAY=864e5, BOXES=[1,3,7,14,30], TARGET=75, MOCK_MIX={people:7,process:8,be:5}, SEC_PER_Q=80;

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

function record(id,ok){
  const r=st.q[id]||{n:0,ok:0,box:0,due:0};
  r.n++;if(ok){r.ok++;r.box=Math.min(r.box+1,BOXES.length);r.due=Date.now()+BOXES[r.box-1]*Q_DAY}

}
function stats(){
  const out={people:{n:0,ok:0},process:{n:0,ok:0},be:{n:0,ok:0}};

function dueQ(){const now=Date.now();return allQ().filter(q=>st.q[q.id]&&st.q[q.id].due<=now)}
function streak(){let n=0,t=Date.now();if(!st.act[dayKey(t)])t-=Q_DAY;while(st.act[dayKey(t)]){n++;t-=Q_DAY}return n}

function isRight(q,picks){
  const want=Array.isArray(q.a)?q.a:[q.a];
  return want.length===picks.length&&want.every(x=>picks.includes(x));
}
const inst=q=>({q,order:shuffle(q.o.map((_,i)=>i)),picks:[],done:false,ok:false,explain:""});

function nextQ(){
  let pool=allQ().filter(q=>S.filter==="all"||q.d===S.filter);
  if(S.last&&pool.length>1)pool=pool.filter(q=>q.id!==S.last);
  const now=Date.now();
  const due=pool.filter(q=>st.q[q.id]&&st.q[q.id].due<=now);
  const unseen=pool.filter(q=>!st.q[q.id]);
  let pick;
  if(due.length)pick=due[rnd(0,due.length-1)];
  else if(unseen.length)pick=unseen[rnd(0,unseen.length-1)];
  else pick=[...pool].sort((a,b)=>st.q[a.id].due-st.q[b.id].due)[0];
  S.cur=inst(pick);
}
function qHTML(it,mode,num_){

/* ---------- calc generators ---------- */
const round10=n=>Math.round(n/10)*10;
function genEVM(){
  const BAC=rnd(20,60)*100,PV=round10(BAC*rnd(30,70)/100),EV=round10(PV*rnd(80,115)/100),AC=round10(EV*rnd(85,120)/100);
  const CPI=EV/AC,SPI=EV/PV,EAC=BAC/CPI;
  const given=[["BAC",BAC],["PV",PV],["EV",EV],["AC",AC]];
  const T=[
    ["CPI",CPI,.011,`CPI = EV ÷ AC = ${EV} ÷ ${AC} = ${num(CPI)}`,CPI<1?"1 미만: 예산을 초과했습니다.":"1 이상: 비용 효율이 계획 이상입니다."],
    ["SPI",SPI,.011,`SPI = EV ÷ PV = ${EV} ÷ ${PV} = ${num(SPI)}`,SPI<1?"1 미만: 일정이 지연되었습니다.":"1 이상: 일정이 계획 이상입니다."],
    ["CV",EV-AC,.5,`CV = EV − AC = ${EV} − ${AC} = ${num(EV-AC)}`,EV-AC<0?"음수: 비용 초과입니다.":"0 이상: 비용 초과가 없습니다."],
    ["SV",EV-PV,.5,`SV = EV − PV = ${EV} − ${PV} = ${num(EV-PV)}`,EV-PV<0?"음수: 일정 지연입니다.":"0 이상: 일정 지연이 없습니다."],
    ["EAC",EAC,BAC*.006,`CPI = ${EV} ÷ ${AC} = ${num(CPI)}\nEAC = BAC ÷ CPI = ${BAC} ÷ ${num(CPI)} ≈ ${num(EAC,0)}`,"현재 비용 효율이 끝까지 유지된다고 가정합니다."],
    ["ETC",EAC-AC,BAC*.006,`EAC = ${BAC} ÷ ${num(CPI)} ≈ ${num(EAC,0)}\nETC = EAC − AC ≈ ${num(EAC-AC,0)}`,"앞으로 더 필요한 비용입니다."],
    ["VAC",BAC-EAC,BAC*.006,`EAC = ${BAC} ÷ ${num(CPI)} ≈ ${num(EAC,0)}\nVAC = BAC − EAC ≈ ${num(BAC-EAC,0)}`,BAC-EAC<0?"음수: 예산을 초과해 끝날 전망입니다.":"0 이상: 예산 안에서 끝날 전망입니다."],
    ["TCPI",(BAC-EV)/(BAC-AC),.011,`TCPI = (BAC − EV) ÷ (BAC − AC) = ${BAC-EV} ÷ ${BAC-AC} = ${num((BAC-EV)/(BAC-AC))}`,"남은 예산으로 끝내려면 필요한 비용 효율입니다."]

}
function genPERT(){
  const O=rnd(2,10),M=O+rnd(2,8),P=M+rnd(3,14),E=(O+4*M+P)/6,SD=(P-O)/6;
  const sd=rnd(0,1);

function genChan(){
  const a=rnd(4,12),b=a+rnd(1,5),ca=a*(a-1)/2,cb=b*(b-1)/2,v=rnd(0,1);
  return {group:"comm",label:"소통 채널",prompt:v?`팀이 ${a}명에서 ${b}명으로 늘었습니다. 소통 채널은 <b>몇 개 늘어납니까?</b>`:`팀원이 프로젝트 관리자를 포함해 ${b}명입니다. 소통 채널은 <b>모두 몇 개입니까?</b>`,given:[],ans:v?cb-ca:cb,tol:.01,steps:v?`${b}×${b-1}÷2 − ${a}×${a-1}÷2 = ${cb} − ${ca} = ${cb-ca}`:`n(n − 1) ÷ 2 = ${b}×${b-1}÷2 = ${cb}`,note:"늘어난 수를 묻는지 전체를 묻는지 구분하세요."};

function genEMV(){

  return {group:"emv",label:"기대 금전 가치",prompt:`위협 1건과 기회 1건이 있습니다. 두 사건의 <b>EMV 합</b>을 구하세요. 단위는 만 원입니다. 위협은 음수로 계산합니다.`,given:[["위협 확률",p1+"%"],["위협 영향","−"+i1],["기회 확률",p2+"%"],["기회 영향","+"+i2]],ans:v,tol:.5,steps:`${p1}% × (−${i1}) = ${num(-p1/100*i1)}\n${p2}% × (+${i2}) = ${num(p2/100*i2)}\n합계 = ${num(v)}`,note:"위협과 기회의 부호를 먼저 정하세요."};

function genNet(){

  const T=Math.max(...Object.values(paths));

  const pick=["dur","B","C","D"][rnd(0,3)];
  const fl={B:T-paths["A-B-E"],C:T-paths["A-C-E"],D:T-paths["D-E"]};
  return {group:"net",label:"크리티컬 패스",prompt:pick==="dur"?"네트워크에서 <b>프로젝트 최단 완료 기간</b>은 며칠입니까? A는 B와 C의 선행 작업입니다.":`네트워크에서 작업 <b>${pick}의 총 여유</b>는 며칠입니까? A는 B와 C의 선행 작업입니다.`,given:[],svg:netSVG(d),ans:pick==="dur"?T:fl[pick],tol:.01,steps:`${list}\n크리티컬 패스: ${crit} (${T}일)${pick==="dur"?"":`\n${pick}의 총 여유 = ${T} − ${pick==="B"?paths["A-B-E"]:pick==="C"?paths["A-C-E"]:paths["D-E"]} = ${fl[pick]}일`}`,note:"가장 긴 경로가 프로젝트 기간을 결정합니다."};

function startMock(){
  const items=[];
  Object.entries(MOCK_MIX).forEach(([d,n])=>{shuffle(allQ().filter(q=>q.d===d)).slice(0,n).forEach(q=>items.push(inst(q)))});
  const total=items.length;
  S.mock={items:shuffle(items),i:0,flags:{},endsAt:Date.now()+total*SEC_PER_Q*1000,total,finished:false,review:false,askEnd:false};
}
function fmtTime(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function finishMock(){
  const m=S.mock;if(m.finished)return;
  m.finished=true;
  const by={people:{n:0,ok:0},process:{n:0,ok:0},be:{n:0,ok:0}};let ok=0;
  m.items.forEach(it=>{it.ok=isRight(it.q,it.picks);it.done=true;by[it.q.d].n++;if(it.ok){by[it.q.d].ok++;ok++}record(it.q.id,it.ok)});
  m.score=ok;m.by=by;
  st.mocks.push({at:Date.now(),ok,total:m.total,by,sec:Math.round((m.total*SEC_PER_Q*1000-Math.max(0,m.endsAt-Date.now()))/1000)});
  if(st.mocks.length>30)st.mocks=st.mocks.slice(-30);
  save();
}

document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");

  }
  else if(a==="submit"){gradeCur();render()}
  else if(a==="nextq"){S.last=S.cur.q.id;nextQ();render();const c=$("#qcard");if(c)c.scrollIntoView({block:"nearest"})}
  else if(a==="filter"){S.filter=b.dataset.f;S.last=null;nextQ();render()}

  }
  else if(a==="cfilter"){S.cardFilter=b.dataset.f;S.cardDone=false;nextCard();S.cardDone=!S.card;render()}
  else if(a==="cagain"){const pool=CARDS.filter(c=>S.cardFilter==="all"||c.t===S.cardFilter);S.card=pool[rnd(0,pool.length-1)];S.flip=false;S.cardDone=false;render()}

  else if(a==="mockstart"){startMock();render();window.scrollTo(0,0)}
  else if(a==="mockclose"){S.mock=null;render()}

  else if(a==="mockprev"){S.mock.i--;render()}
  else if(a==="mocknext"){S.mock.i++;render()}
  else if(a==="mockflag"){const m=S.mock;m.flags[m.i]=!m.flags[m.i];render()}
  else if(a==="mockask"){S.mock.askEnd=true;render()}
  else if(a==="mockstay"){S.mock.askEnd=false;render()}
  else if(a==="mockfinish"){finishMock();render();window.scrollTo(0,0)}

  else if(a==="resetyes"){const ex=st.exam;st=fresh();st.exam=ex;S.reset=false;S.cur=null;S.card=null;S.cardDone=false;save();render()}
});

    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});S.msg="백업 파일을 내보냈습니다."}
    else{const u=URL.createObjectURL(file),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);S.msg="백업 파일을 저장했습니다."}
  }catch(e){S.msg=e&&e.name==="AbortError"?"백업을 취소했습니다.":"백업하지 못했습니다. 다시 시도해 주세요."}
  render();
}
function cleanBackup(o){
  const obj=v=>v&&typeof v==="object"&&!Array.isArray(v)?v:{};
  if(!o||typeof o!=="object"||!o.q||!o.c)return null;
  const rec=m=>Object.fromEntries(Object.entries(obj(m)).filter(([,r])=>r&&Number.isFinite(r.box)&&Number.isFinite(r.due)));
  const by=b=>b&&["people","process","be"].every(k=>b[k]&&Number.isFinite(b[k].n)&&Number.isFinite(b[k].ok));
  return {...fresh(),q:rec(o.q),c:rec(o.c),
    calc:{n:+obj(o.calc).n||0,ok:+obj(o.calc).ok||0},
    mocks:(Array.isArray(o.mocks)?o.mocks:[]).filter(m=>m&&Number.isFinite(m.at)&&by(m.by)),
    act:obj(o.act),exam:/^\d{4}-\d{2}-\d{2}$/.test(o.exam||"")?o.exam:"",
    ai:(Array.isArray(o.ai)?o.ai:[]).filter(q=>validAI(q)&&DOMAINS[q.d]&&typeof q.id==="string"&&typeof q.pd==="string")};
}
function gradeCur(){
  const it=S.cur;it.ok=isRight(it.q,it.picks);it.done=true;record(it.q.id,it.ok);save();
}
const AI_ERR={rate_limited:"요청이 많습니다. 잠시 뒤 다시 시도해 주세요.",not_granted:"Claude 사용 권한이 허용되지 않았습니다.",invalid_json:"응답 형식이 맞지 않았습니다. 한 번 더 눌러 주세요."};
async function explainCur(){
  const it=S.cur;if(!sample||it.explaining)return;
  it.explaining=true;it.explain="";render();
  const q=it.q,want=Array.isArray(q.a)?q.a:[q.a];
  const prompt=`당신은 PMP 시험 코치입니다. 아래 연습 문제를 한국어로 300자 안팎으로 설명하세요. 정답의 근거, 수험생이 고른 답이 틀렸다면 왜 틀렸는지, 비슷한 문제에서 쓸 판단 기준 하나를 평문으로 쓰세요. 마크다운은 쓰지 마세요.\n\n문제: ${q.q}\n선택지: ${q.o.map((x,i)=>i+1+") "+x).join(" / ")}\n정답: ${want.map(i=>i+1).join(", ")}\n수험생의 답: ${it.picks.map(i=>i+1).join(", ")}`;
  try{
    const r=await sample(prompt,{cache:false,onText:({text})=>{it.explain=text;const el=$("#explain");if(el)el.textContent=text}});
    it.explain=r.text;
  }catch(e){if(e&&e.text)it.explain=e.text;else it.explain=AI_ERR[e&&e.code]||"설명을 가져오지 못했습니다. 잠시 뒤 다시 시도해 주세요."}
  it.explaining=false;render();
}
function validAI(o){
  return o&&typeof o.q==="string"&&o.q.length>10&&Array.isArray(o.o)&&o.o.length===4&&o.o.every(x=>typeof x==="string"&&x)&&Number.isInteger(o.a)&&o.a>=0&&o.a<4&&typeof o.x==="string"&&o.x;
}
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="calcform"){
    const c=S.calc,raw=$("#calcinput").value.replace(/[,\s]|만원|원|일|개|−/g,m=>m==="−"?"-":"");
    const v=parseFloat(raw);
    if(raw===""||isNaN(v)){S.calcErr=true;c.input=$("#calcinput").value;render();return}
    S.calcErr=false;c.input=$("#calcinput").value;c.done=true;c.ok=Math.abs(v-c.ans)<=c.tol;
    st.calc.n++;if(c.ok)st.calc.ok++;touch();save();render();
  }
  if(e.target.id==="aiform"){
    if(!sample||S.aiBusy)return;
    const d=$("#aidom").value,topic=$("#aitopic").value.trim();
    S.aiDom=d;S.aiBusy=true;S.aiErr="";render();
    const prompt=`PMP 시험 대비용 시나리오 연습 문제를 한국어로 1개 새로 만드세요. 실제 시험 문제를 베끼지 마세요.\n시험 영역: ${DOMAINS[d].en} (${DOMAINS[d].name})${topic?`\n주제: ${topic}`:""}\n조건: 현실적 상황 2~3문장, 그럴듯한 선택지 4개, 정답 1개. PMBOK 8판 원칙(전체론적 관점, 가치, 품질 내재화, 책임 있는 리더십, 지속가능성, 권한 있는 문화)과 맞게 판단하게 하세요. 프로세스 이름이나 페이지 번호는 지어내지 마세요.\nJSON만 출력하세요: {"q":"문제","o":["선택지1","선택지2","선택지3","선택지4"],"a":정답인덱스0부터3,"x":"정답 근거와 오답 이유 2~3문장","pd":"거버넌스|범위|일정|재무|이해관계자|자원|리스크 중 하나"}`;
    try{
      const o=await sample.json(prompt,{cache:false});
      if(!validAI(o)){S.aiErr=AI_ERR.invalid_json}
      else{const q={id:"ai"+Date.now(),d,pd:typeof o.pd==="string"?o.pd.slice(0,10):"AI",q:o.q,o:o.o,a:o.a,x:o.x,ai:true};st.ai.push(q);if(st.ai.length>100)st.ai=st.ai.slice(-100);S.cur=inst(q);save()}
    }catch(err){S.aiErr=AI_ERR[err&&err.code]||"문제를 만들지 못했습니다. 잠시 뒤 다시 시도해 주세요."}
    S.aiBusy=false;render();
  }
});
document.addEventListener("change",async e=>{
  if(e.target.id==="restore"&&e.target.files[0]){
    try{const c=cleanBackup(JSON.parse(await e.target.files[0].text()));
      if(!c)throw 0;st=c;S.cur=null;S.card=null;S.cardDone=false;S.mock=null;S.msg="백업을 불러왔습니다.";save()}
    catch(_){S.msg="이 파일은 불러올 수 없습니다. 이 앱에서 만든 백업 파일을 선택해 주세요."}
    render();return;
  }
  if(e.target.id==="exam"){st.exam=e.target.value;save();render()}
  if(e.target.id==="aidom")S.aiDom=e.target.value;
});
document.addEventListener("input",e=>{if(e.target.id==="calcinput"&&S.calc)S.calc.input=e.target.value});

render();
setSaved("이 기기에 저장됨");
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
